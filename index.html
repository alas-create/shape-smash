<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Smash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The Custom Watermark -->
    <div class="watermark">
        <h1>GAME NI DAELAN</h1>
        <h2>A DAELAN ORIGINAL</h2>
    </div>

    <!-- The Main Menu -->
    <div id="main-menu">
        <h1 class="game-title">SHAPE SMASH</h1>
        <button id="start-btn">Play Now</button>
    </div>

    <!-- The Level Selection Screen -->
    <div id="level-select" style="display: none;">
        <h1 class="game-title">SELECT LEVEL</h1>
        <div class="level-grid">
            <button class="level-btn" onclick="startLevel(1)">1</button>
            <button class="level-btn" onclick="startLevel(2)">2</button>
            <button class="level-btn" onclick="startLevel(3)">3</button>
            <button class="level-btn" onclick="startLevel(4)">4</button>
            <button class="level-btn" onclick="startLevel(5)">BOSS</button>
        </div>
    </div>

    <!-- The Game Area -->
    <div id="game-container" style="display: none;">
        <div id="hud">
            Level <span id="current-level-text">1</span> | Shots: <span id="shot-count">3</span> | Targets: <span id="target-count">6</span>
        </div>
        
        <div id="message-screen">
            <h1 id="message-text"></h1>
            <button id="next-level-btn" class="ui-btn" style="display: none;">Next Level</button>
            <button id="retry-btn" class="ui-btn">Retry Level</button>
            <button id="menu-btn" class="ui-btn">Main Menu</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
