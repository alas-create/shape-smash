<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shape Smash</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- The Custom Watermark -->
    <div class="watermark">
        <h1>GAME NI DAELAN</h1>
        <h2>A DAELAN ORIGINAL</h2>
    </div>

    <!-- The Main Menu -->
    <div id="main-menu">
        <h1 class="game-title">SHAPE SMASH</h1>
        <button id="start-btn">Start Game</button>
    </div>

    <!-- The Game Area -->
    <div id="game-container">
        <!-- New HUD (Heads-Up Display) -->
        <div id="hud">
            Shots Left: <span id="shot-count">3</span> | Targets Left: <span id="target-count">6</span>
        </div>
        
        <!-- New Game Over / Win Screen -->
        <div id="message-screen">
            <h1 id="message-text"></h1>
            <!-- We will refresh the page to restart for now -->
            <button id="restart-btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
